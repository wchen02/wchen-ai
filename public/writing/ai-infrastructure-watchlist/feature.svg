<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI infrastructure watchlist</title>
  <desc id="desc">A dark market map connecting memory, semiconductors, data centers, and space infrastructure tickers.</desc>
  <rect width="1200" height="630" rx="42" fill="#080d1c"/>
  <rect x="70" y="64" width="1060" height="502" rx="34" fill="#10182b" stroke="#2a3a5f" stroke-width="2"/>
  <circle cx="106" cy="101" r="8" fill="#ef4444"/>
  <circle cx="132" cy="101" r="8" fill="#f59e0b"/>
  <circle cx="158" cy="101" r="8" fill="#22c55e"/>

  <text x="92" y="160" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="800">AI Infrastructure Watchlist</text>
  <text x="94" y="204" fill="#9fb1d1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Memory, chips, data centers, and orbital infrastructure as one capacity trade.</text>

  <path d="M600 280L292 344" stroke="#334466" stroke-width="3" stroke-linecap="round"/>
  <path d="M600 280L506 438" stroke="#334466" stroke-width="3" stroke-linecap="round"/>
  <path d="M600 280L728 438" stroke="#334466" stroke-width="3" stroke-linecap="round"/>
  <path d="M600 280L908 344" stroke="#334466" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(484 236)">
    <circle cx="116" cy="44" r="62" fill="#17213a" stroke="#38bdf8" stroke-width="3"/>
    <text x="58" y="38" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">THEME</text>
    <text x="42" y="70" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="900">CAPACITY</text>
  </g>

  <g transform="translate(122 290)">
    <rect width="340" height="108" rx="24" fill="#17213a" stroke="#475569" stroke-width="2"/>
    <text x="28" y="40" fill="#c084fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">AI Memory</text>
    <text x="28" y="76" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">MU / SNDK / WDC / DRAM</text>
  </g>

  <g transform="translate(676 290)">
    <rect width="402" height="108" rx="24" fill="#17213a" stroke="#475569" stroke-width="2"/>
    <text x="28" y="40" fill="#38bdf8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">Semiconductors</text>
    <text x="28" y="76" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">SOXL / NVDA / GLW / QCOM</text>
  </g>

  <g transform="translate(230 430)">
    <rect width="340" height="96" rx="24" fill="#17213a" stroke="#475569" stroke-width="2"/>
    <text x="28" y="38" fill="#22c55e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">Data Center</text>
    <text x="28" y="72" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800">GOOD / AMZN / IREN / CORZ / APLD</text>
  </g>

  <g transform="translate(644 430)">
    <rect width="326" height="96" rx="24" fill="#17213a" stroke="#475569" stroke-width="2"/>
    <text x="28" y="38" fill="#f97316" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">Space</text>
    <text x="28" y="72" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">NASA / RKLB</text>
  </g>

  <text x="94" y="536" fill="#7182a8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">A watchlist for physical bottlenecks, not AI slogans</text>
